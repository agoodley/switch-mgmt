# Lab network used by `make lab-*` and the test-suite.
#
# Six fake switches that reproduce the usual problems of a network that grew
# without an STP design:
#   * every switch has the default priority, so acc-01 (oldest switch, lowest
#     MAC) is the root bridge instead of the core
#   * mixed PVST+ / Rapid-PVST+
#   * a flapping PC on acc-03 Gi1/0/7 without PortFast causing a stream of
#     topology changes
#   * an unmanaged switch running STP behind acc-02 Gi1/0/11
#   * a native VLAN mismatch between acc-02 and acc-04 (daisy chain)
#   * an old 12.2 switch (acc-04) that only speaks legacy SSH algorithms
#
# The fake switches recompute spanning tree from their running-config, so the
# effect of `make apply` shows up in the next `make audit`.
site: lab
vlans: {1: default, 10: USERS, 20: VOICE, 99: MGMT}
ssh:
  username: labadmin
  password: labpass
  enable: labenable
  base_port: 2201          # one SSH port per switch, in the order below

switches:
  core-01:
    mac: 00a3.d1f4.1180
    model: C9300-48P
    version: 17.09.04a
    iosxe: true
    mode: rapid-pvst
    uptime_days: 212
    mgmt_ip: 10.99.0.1
    access_ports: {prefix: GigabitEthernet1/0/, from: 10, to: 24, vlan: 10, connected: 4}
    port_layout: {GigabitEthernet1/0/: 24, TenGigabitEthernet1/1/: 4}
  core-02:
    mac: 00a3.d1f4.2280
    model: C9300-48P
