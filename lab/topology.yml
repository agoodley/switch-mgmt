links:
  - [core-01, TenGigabitEthernet1/1/1, core-02, TenGigabitEthernet1/1/1, Port-channel1]
  - [core-01, TenGigabitEthernet1/1/2, core-02, TenGigabitEthernet1/1/2, Port-channel1]
  - [core-01, GigabitEthernet1/0/1, acc-01, GigabitEthernet1/0/49]
  - [core-02, GigabitEthernet1/0/1, acc-01, GigabitEthernet1/0/50]
  - [core-01, GigabitEthernet1/0/2, acc-02, GigabitEthernet1/0/49]
  - [core-02, GigabitEthernet1/0/2, acc-02, GigabitEthernet1/0/50]
  - [core-01, GigabitEthernet1/0/3, acc-03, GigabitEthernet1/0/49]
  - [core-02, GigabitEthernet1/0/3, acc-03, GigabitEthernet1/0/50]
  - [acc-03, GigabitEthernet1/0/48, acc-04, GigabitEthernet0/1]
  - [acc-02, GigabitEthernet1/0/48, acc-04, GigabitEthernet0/2]

problems:
  flapping_port:
    switch: acc-03
    port: GigabitEthernet1/0/7
    every_seconds: 90          # link down/up cycle of the attached PC
    historic_changes: 21430    # TCs counted before the lab started
  rogue_switch:
    switch: acc-02
    port: GigabitEthernet1/0/11
    bpdus_received: 7
  native_vlan_mismatch:
    switch: acc-04
    port: GigabitEthernet0/2
    native_vlan: 99
  errdisabled:
    switch: acc-04
    port: FastEthernet0/15
    reason: bpduguard
  macflap:
