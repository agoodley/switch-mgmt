    mgmt_ip: 10.99.0.2
    access_ports: {prefix: GigabitEthernet1/0/, from: 10, to: 24, vlan: 10, connected: 2}
    port_layout: {GigabitEthernet1/0/: 24, TenGigabitEthernet1/1/: 4}
  acc-01:
    mac: 0019.e8a4.0100
    model: WS-C2960X-48FPD-L
    version: 15.2(7)E8
    mode: pvst
    portfast_edge_syntax: true
    uptime_days: 97
    mgmt_ip: 10.99.0.11
    access_ports: {prefix: GigabitEthernet1/0/, from: 1, to: 44, vlan: 10, voice_vlan: 20, connected: 30}
