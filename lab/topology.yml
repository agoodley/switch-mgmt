  acc-02:
    mac: 0021.a0b1.0200
    model: WS-C2960X-48FPD-L
    version: 15.2(7)E8
    mode: pvst
    portfast_edge_syntax: true
    uptime_days: 97
    mgmt_ip: 10.99.0.12
    access_ports: {prefix: GigabitEthernet1/0/, from: 1, to: 44, vlan: 10, voice_vlan: 20, connected: 26}
    port_layout: {GigabitEthernet1/0/: 52}
  acc-03:
    mac: 0023.5e11.0300
    model: WS-C2960X-48FPD-L
    version: 15.2(7)E8
    mode: rapid-pvst
    portfast_edge_syntax: true
    uptime_days: 41
    mgmt_ip: 10.99.0.13
