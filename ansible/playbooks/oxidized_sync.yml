---
# Generate Oxidized's device list (oxidized/router.json) from the Ansible
# inventory and ask Oxidized to reload it.  Node names are the inventory
# names, so they match LibreNMS and the LibreNMS "Config" tab works.
#
#   make sync-oxidized
#
# The file always lists every switch in the inventory, even with --limit.
# It holds each switch's login (credentials.yml, or the .env default), so it
# is readable by its owner only.  Oxidized checks SSH host keys strictly:
# keys of switches it has never seen are recorded here first (trust on first
# use, in data/ssh/known_hosts); changed keys are reported, not accepted.

- name: Write router.json and reload Oxidized
  hosts: switches
  gather_facts: false
  roles:
    - switch_mgmt_defaults
  tasks:
    # Oxidized only uses `ip` when it is a literal address; a DNS name would be
    # ignored in favour of the node name, so resolve names here.
    - name: Resolve management addresses
      ansible.builtin.set_fact:
        oxidized_ips: "{{ oxidized_ips | default({}) | combine({item: oxidized_addr}) }}"
        oxidized_targets: >-
          {{ oxidized_targets | default([])
             + [('[' ~ oxidized_addr ~ ']' if ':' in oxidized_addr else oxidized_addr) ~ ':' ~ (hostvars[item].ansible_port | default(22))] }}
      loop: "{{ groups['switches'] | default([]) }}"
      vars:
        oxidized_name: "{{ hostvars[item].ansible_host | default(item) }}"
        oxidized_addr: >-
          {{ oxidized_name if oxidized_name is match('^[0-9.]+$|.*:') else
             (lookup('ansible.builtin.pipe', 'getent ahostsv4 ' ~ (oxidized_name | quote) ~ " | head -n 1 | cut -d ' ' -f 1")
              | default(oxidized_name, true)) }}
      run_once: true
      delegate_to: localhost

    - name: Record the switches' SSH host keys
      ansible.builtin.command:
        argv: "{{ ['netaudit', 'known-hosts', '--file', oxidized_known_hosts] + oxidized_targets }}"
      vars:
        oxidized_known_hosts: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
      register: oxidized_keys
      changed_when: oxidized_keys.stdout is search('^added ', multiline=True)
      failed_when: oxidized_keys.rc not in [0, 3]
      run_once: true
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Host keys Oxidized cannot use
      ansible.builtin.debug:
        msg: "{{ oxidized_keys.stdout_lines | select('match', '^(changed|error) ') | list }}"
      run_once: true
      when:
        - not ansible_check_mode
        - oxidized_keys.stdout is search('^(changed|error) ', multiline=True)

    - name: Write oxidized/router.json
      ansible.builtin.template:
        src: oxidized-router.json.j2
        dest: "{{ oxidized_dir }}/router.json"
        mode: "0600"
      # the file holds passwords: never print a diff of it
      diff: false
      register: oxidized_file
      run_once: true
      delegate_to: localhost

    - name: Ask Oxidized to reload its node list
      ansible.builtin.uri:
        url: "{{ oxidized_url }}/reload?format=json"
        status_code: [200]
      register: oxidized_reload
      failed_when: false
      run_once: true
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Result
      ansible.builtin.debug:
        msg: >-
          {{ groups['switches'] | length }} switch(es) in the inventory, written to {{ oxidized_dir }}/router.json.
          {{ 'Oxidized reloaded.' if (oxidized_reload.status | default(0)) == 200 else
             'Oxidized is not reachable right now - it reads the file when it starts.' }}
      run_once: true
