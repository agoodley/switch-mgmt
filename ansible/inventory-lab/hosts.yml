---
# The simulated lab from lab/topology.yml (`make lab-up`).  Use it to try the
# playbooks safely:  make audit INVENTORY=inventory-lab
switches:
  children:
    lab:
      vars:
        site: lab
      hosts:
        core-01: {ansible_port: 2201, stp_role: root_primary}
        core-02: {ansible_port: 2202, stp_role: root_secondary}
        acc-01: {ansible_port: 2203}
        acc-02: {ansible_port: 2204}
        acc-03: {ansible_port: 2205}
        acc-04: {ansible_port: 2206}
