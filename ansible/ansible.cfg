[defaults]
inventory = ./inventory
roles_path = ./roles
filter_plugins = ./filter_plugins
forks = 20
timeout = 30
gathering = explicit
# Trust on first use: a switch's SSH host key is recorded the first time
# (in data/ssh/known_hosts, shared with Oxidized) and a changed key stops the
# run.  After replacing a switch: make forget-host HOST=<address>.
host_key_checking = True
# Per-switch / per-site logins from inventory/credentials.yml.
vars_plugins = ./vars_plugins
vars_plugins_enabled = host_group_vars, switch_credentials
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
display_skipped_hosts = False
# Collections are baked into the toolbox image (see Dockerfile / requirements.yml).
collections_path = /usr/share/ansible/collections:~/.ansible/collections

[persistent_connection]
# `show spanning-tree detail` on a 48-port switch with many VLANs is large.
connect_timeout = 30
command_timeout = 120

[paramiko_connection]
look_for_keys = False
host_key_auto_add = True

[inventory]
# Skip the example site (and editor leftovers) in inventory/sites/.
ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .ini, .cfg, .retry, .sample
# credentials.yml holds logins, not hosts (read by vars_plugins/switch_credentials.py).
ignore_patterns = ^credentials\.yml$
